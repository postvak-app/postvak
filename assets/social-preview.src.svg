<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1280" xml:space="preserve">
  <rect width="2560" height="1280" fill="#1c2436"/>
  <g transform="translate(160 296) scale(1.6)">
    <rect x="18" y="32" width="84" height="56" rx="7" fill="#f3eee4"/>
    <rect x="78" y="40" width="16" height="18" rx="2" fill="#e8562f"/>
    <rect x="27" y="62" width="34" height="5" rx="2.5" fill="#0a0e1b"/>
    <rect x="27" y="71" width="44" height="5" rx="2.5" fill="#0a0e1b"/>
    <rect x="27" y="80" width="26" height="5" rx="2.5" fill="#0a0e1b"/>
  </g>
  <text x="392" y="442" font-family="Bricolage Grotesque" font-weight="600" font-size="150" letter-spacing="-3" fill="#f3eee4">Postvak</text>
  <g font-family="Hanken Grotesk" font-weight="500" font-size="80" fill="#f3eee4">
    <text x="160" y="610">Your inbox, organized</text>
    <text x="160" y="700">by rules you write.</text>
  </g>
  <g font-family="Hanken Grotesk" font-weight="500" font-size="54" fill="#a8adbd">
    <text x="160" y="800">Test every rule with a dry run. Undo any delete.</text>
    <text x="160" y="872">Runs in the background, on any IMAP server.</text>
  </g>
  <g fill="#2b3650">
    <rect x="160" y="944" width="151" height="66" rx="33"/>
    <rect x="335" y="944" width="293" height="66" rx="33"/>
    <rect x="652" y="944" width="340" height="66" rx="33"/>
    <rect x="1016" y="944" width="140" height="66" rx="33"/>
  </g>
  <g font-family="Spline Sans Mono" font-weight="500" font-size="38" fill="#f3eee4" text-anchor="middle">
    <text x="235.5" y="990">IMAP</text>
    <text x="481.5" y="990">rules.toml</text>
    <text x="822" y="990">local SQLite</text>
    <text x="1086" y="990">MCP</text>
  </g>
  <rect x="1400" y="330" width="1000" height="620" rx="30" fill="#f3eee4"/>
  <g font-family="Spline Sans Mono" font-weight="500" font-size="38" fill="#1c2436">
    <text x="1460" y="445" fill="#6b6a75"># rules.toml</text>
    <text x="1460" y="505">[[rules]]</text>
    <text x="1460" y="565">name = <tspan fill="#c94420">"purge sign-in codes"</tspan></text>
    <text x="1460" y="625">match.subject = { regex =</text>
    <text x="1460" y="685">  <tspan fill="#c94420">"sign.?in|magic link"</tspan> }</text>
    <text x="1460" y="745">match.older_than = <tspan fill="#c94420">"1h"</tspan></text>
    <text x="1460" y="805">match.read = <tspan fill="#c94420">true</tspan></text>
    <text x="1460" y="865">actions.delete = <tspan fill="#c94420">true</tspan></text>
  </g>
</svg>
