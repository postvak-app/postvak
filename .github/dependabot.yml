version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      # Slint releases carry fixes Postvak waits for; all its crates move as one.
      exclude: ["const-field-offset*", "i-slint-*", "slint*", "vtable*"]
    ignore:
      # Postvak's fontique Collection goes to Blitz's Parley, so it must stay on Parley's version; bump it by hand
      # together with blitz-*. 0.x minor releases break, which Dependabot counts as minor.
      - dependency-name: fontique
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Slint, AccessKit, ksni and the Secret Service keyring store all use zbus; a major bump here alone would build
      # a second zbus. Bump it by hand once they have moved.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Blitz paints into anyrender without re-exporting it, so both must move as one
      html-render:
        patterns: ["anyrender*", "blitz-*"]
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    # Generated by `dist generate`; dist's own check fails on any hand or bot edit.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /tests/dovecot
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /packaging/docker
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
