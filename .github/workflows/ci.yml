name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-machete
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --no-default-features --all-targets
      - run: cargo machete
      - run: cargo audit

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start Dovecot
        if: runner.os == 'Linux'
        run: |
          docker compose -f tests/dovecot/compose.yml up -d
          echo "POSTVAK_TEST_IMAP_HOST=localhost" >> "$GITHUB_ENV"
      # The GUI snapshots show local times; Slint's software renderer draws them the same on every machine.
      - run: cargo test --all-features
        env:
          TZ: UTC
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs-${{ matrix.os }}
          path: tests/snapshots/*.new.png
          if-no-files-found: ignore
