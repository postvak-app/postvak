name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # A merge-queue branch exists for one run, so nothing can read what sccache writes there; it would only crowd main's entries out of the 10 GB quota.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'merge_group' && 'READ_ONLY' || 'READ_WRITE' }}

jobs:
  # Whether lint and test need to build. lint, test (macos-latest) and test (ubuntu-latest) are required checks, so they always report.
  select:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      warm: ${{ steps.select.outputs.warm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          changed() { git diff --name-only "$1" HEAD; }
          # Paths no build or test reads. docs/src, README.md and the .desktop file are read by tests, and ci.yml is this workflow, so they still build.
          only_unread() {
            ! grep -qE '^(\.github/workflows/ci\.yml$|docs/src/|packaging/.*\.desktop$|README\.md$)' <<<"$1" &&
              ! grep -qvE '^(\.claude/|\.coderabbit\.yaml$|\.github/|\.mise\.toml$|dist-workspace\.toml$|docs/|LICENSE|packaging/|release-plz\.toml$|[^/]+\.md$)' <<<"$1"
          }
          build=true
          warm=false
          case "$EVENT" in
            pull_request) only_unread "$(changed "$PR_BASE")" && build=false ;;
            merge_group) only_unread "$(changed "$MERGE_GROUP_BASE")" && build=false ;;
            push)
              # The merge queue already ran CI on this commit. Compile without running the tests anyway, so main's caches stay current:
              # pull requests can read caches written on main, not ones written in the merge queue.
              passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=merge_group&status=success" --jq .total_count)
              if [ "$passed" -gt 0 ]; then
                if only_unread "$(changed "$BEFORE")"; then build=false; else warm=true; fi
              fi
              ;;
          esac
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
          echo "warm=$warm" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: select
    # A failed select job leaves the output empty, and then everything builds.
    if: ${{ !cancelled() && needs.select.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    env:
      # rust-cache keeps only the dependencies, and Cargo judges the workspace crates by mtime, which a checkout resets.
      # sccache keys on content, so a crate a pull request leaves alone comes from the cache.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --no-default-features --all-targets
      - run: cargo machete
      - run: cargo deny check

  test:
    needs: select
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A skipped matrix job loses its os in the check name, which then never matches the required check, so the steps skip instead.
      BUILD: ${{ needs.select.outputs.build != 'false' }}
      # Main after the merge queue passed: compile to fill the caches, run nothing.
      WARM: ${{ needs.select.outputs.warm == 'true' }}
      # A pull request only type-checks on macOS: the suite is platform-neutral and the merge queue still runs it there in full,
      # while check skips codegen and linking. Main runs the same check so its artifacts are cached.
      CHECK_ONLY: ${{ github.event_name == 'pull_request' && matrix.os == 'macos-latest' }}
      NEXTEST_PROFILE: ci
      # See lint.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # The GUI snapshots show local times; Slint's software renderer draws them the same on every machine.
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'
        with:
          persist-credentials: false
      - run: rustup toolchain install
        if: env.BUILD == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.BUILD == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: env.BUILD == 'true'
        with:
          version: v0.19.0
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        if: env.BUILD == 'true'
        with:
          tool: cargo-nextest
      - name: Start Dovecot
        if: env.BUILD == 'true' && env.WARM != 'true' && runner.os == 'Linux'
        run: |
          docker compose -f tests/dovecot/compose.yml up -d
          echo "POSTVAK_TEST_IMAP_HOST=localhost" >> "$GITHUB_ENV"
      - run: cargo check --all-targets --all-features
        if: env.BUILD == 'true' && (env.CHECK_ONLY == 'true' || (env.WARM == 'true' && runner.os == 'macOS'))
      - run: cargo nextest run --cargo-profile ci --all-features --no-run
        if: env.BUILD == 'true' && env.WARM == 'true'
      - run: cargo nextest run --cargo-profile ci --all-features
        if: env.BUILD == 'true' && env.WARM != 'true' && env.CHECK_ONLY != 'true'
      # nextest does not run doc tests.
      - run: cargo test --profile ci --all-features --doc
        if: env.BUILD == 'true' && env.WARM != 'true' && env.CHECK_ONLY != 'true'
      - name: Upload test results
        if: env.BUILD == 'true' && env.WARM != 'true' && env.CHECK_ONLY != 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-diffs-${{ matrix.os }}
          path: tests/snapshots/*.new.png
          if-no-files-found: ignore

  # How long the window takes to show a list and how much memory the GUI and the daemon use (scripts/startup.py,
  # docs/src/perf.md). The software renderer under Xvfb keeps runs comparable. It only reports: not a required check, no
  # limits until a few runs show the noise. The merge queue skips it; main's push records the numbers for each merge.
  startup:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.build != 'false' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    env:
      # See lint.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0
      - run: cargo build --release
      - name: Measure
        env:
          SLINT_BACKEND: winit-software
        run: xvfb-run -a -s "-screen 0 1920x1080x24" scripts/startup.py run --runs 5 --out startup.json
      - run: scripts/startup.py show startup.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-report
          path: startup.json
