name: Release-plz

on:
  push:
    branches: [main]
  # The release PR refreshes daily, not per push, since each refresh runs CI, CodeQL and dist plan on it; dispatch by hand before a release.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish and tag
    if: github.repository_owner == 'postvak-app' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # A tag pushed with the default GITHUB_TOKEN would not start release.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Release PR
    if: github.repository_owner == 'postvak-app' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # PRs opened with the default GITHUB_TOKEN would not run CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
