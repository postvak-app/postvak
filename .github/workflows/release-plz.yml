name: Release-plz

on:
  # Every push to main publishes what a merged release PR bumped, and refreshes the release PR, so it always holds
  # everything merged; each refresh runs CI, CodeQL and dist plan on it.
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish and tag
    if: github.repository_owner == 'postvak-app' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          # A tag pushed with the default GITHUB_TOKEN would not start release.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Release PR
    if: github.repository_owner == 'postvak-app'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          # PRs opened with the default GITHUB_TOKEN would not run CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # cargo-semver-checks resolves each crate in a throwaway project without Cargo.lock, under our
          # .cargo/config.toml, so a dependency younger than its 3-day publish age (a new Slint) failed to resolve.
          # That lockfile is never shipped; Cargo.lock keeps the age rule.
          CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: allow
