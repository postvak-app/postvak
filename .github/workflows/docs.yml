name: Docs

on:
  push:
    branches: [main]
    paths: [.github/workflows/docs.yml, assets/**, docs/book.toml, docs/src/**, docs/theme/**, packaging/linux/flatpak-repo.sh]
  # flatpak.yml starts this once a release's bundles are attached, so the Flatpak repository gets them.
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: mdbook
      - run: mdbook build docs
      # Every deploy replaces the whole site, so each one carries the Flatpak repository as well.
      - name: Add the Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://postvak.pataar.nl
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak ostree
          packaging/linux/flatpak-repo.sh docs/book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
