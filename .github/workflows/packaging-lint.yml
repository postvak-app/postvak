name: Packaging lint

on:
  push:
    branches: [main]
    paths: ["packaging/**", "assets/**", ".github/workflows/**"]
  pull_request:
    paths: ["packaging/**", "assets/**", ".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils shellcheck
      - run: desktop-file-validate packaging/linux/*.desktop
      - run: appstreamcli validate --no-net packaging/linux/*.metainfo.xml
      - run: shellcheck packaging/*.sh packaging/*/*.sh packaging/linux/AppRun packaging/linux/flatpak/postvak-launch
