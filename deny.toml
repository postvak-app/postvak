[graph]
all-features = true

[advisories]
# Every entry needs a reason: { id = "RUSTSEC-…", reason = "…" }
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "needs a crafted -wal file, and Postvak opens only the stores it writes in its own data dir; rusqlite 0.41 has the fix, but rusqlite_migration 2.6 still requires 0.40" },
]
# Unmaintained transitive crates (zbus internals, ttf-parser) are their parents' call; fail only on our direct dependencies.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "0BSD",  # quoted_printable, through lettre: BSD without even the notice requirement
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
allow-git = ["https://github.com/pataar/slint"]  # Slint with the Wayland clipboard fix, until a release has it (Cargo.toml [patch.crates-io])
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
