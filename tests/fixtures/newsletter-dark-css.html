<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><style>
:root{color-scheme:light dark}
body{margin:0;background:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#1d1d1f}
.card{background:#f5f5f7;border-radius:8px}
.btn{display:inline-block;background:#0071e3;color:#ffffff;padding:12px 22px;border-radius:6px;text-decoration:none;font-weight:bold}
a{color:#0066cc}
@media (prefers-color-scheme:dark){
body{background:#0b0d12;color:#f5f5f7}
.card{background:#1c1f26}
a{color:#7cc4ff}
.muted{color:#a1a1a6}
}
h1{font-size:26px;margin:0 0 12px}
</style></head><body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 0">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" class="card">
<tr><td style="padding:28px">
<h1>Night mode, by the sender</h1>
<p style="line-height:1.5">This message brings its own dark-mode styles, so Postvak shows them as written. Read the <a href="https://example.com/notes">release notes</a>.</p>
<p style="text-align:center;margin:28px 0"><a class="btn" href="https://example.com/cta">Open the app</a></p>
<p class="muted" style="font-size:11px">You get this because you subscribed.</p>
</td></tr>
</table></td></tr></table></body></html>
