namespace inbox {
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

ssl_server {
  cert_file = /etc/postvak-test/tls.crt
  key_file = /etc/postvak-test/tls.key
}

# IPv4 only: the image's default also binds `::`, which fails, and stops Dovecot, where the host or container has no
# IPv6. compose.yml publishes the port on 127.0.0.1 alone, so nothing reaches it over IPv6 anyway.
listen = *

# Throwaway test mail: durability buys nothing and slows every APPEND.
mail_fsync = never
