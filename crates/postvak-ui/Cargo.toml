[package]
name = "postvak-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Postvak's window markup, compiled from Slint into Rust"
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["/assets/**", "/build.rs", "/LICENSE-*", "/src/**", "/ui/**"]

[dependencies]
slint.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { workspace = true, features = ["fontconfig-dlopen"] }  # as in postvak-gui: published alone, this crate would otherwise link fontconfig

[build-dependencies]
slint-build.workspace = true

[package.metadata.cargo-machete]
# only sets a feature of Slint's
ignored = ["i-slint-common"]

[lints]
workspace = true
