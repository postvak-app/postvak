[workspace]
members = ["crates/*"]
# Plain `cargo test`, `clippy` and `check` at the root cover every crate.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "A fast, simple mail client with automatic mailbox rules"
documentation = "https://postvak.pataar.nl/"
repository = "https://github.com/postvak-app/postvak"
homepage = "https://postvak.pataar.nl/"
keywords = ["automation", "email", "email-client", "imap", "mail-filter"]
categories = ["command-line-utilities", "email"]

[workspace.dependencies]
# Pinned exactly: their APIs are internal and change between patch releases, so a published binary builds only with its own.
postvak-core = { version = "=0.3.1", path = "crates/postvak-core" }  # sync, store, rules and the daemon: everything below the front ends
postvak-gui = { version = "=0.3.1", path = "crates/postvak-gui" }    # the Slint window, behind the `gui` feature
postvak-mcp = { version = "=0.3.1", path = "crates/postvak-mcp" }    # the MCP server, behind the `mcp` feature

anyhow = "1"                                         # error context in the binary and sync loop
anyrender = "=0.14.0"                                # the drawing trait Blitz paints into; pinned to the version blitz-paint uses
anyrender_vello_cpu = "=0.18.0"                      # CPU raster for Blitz, so HTML mail becomes an image in the window without a GPU path
apple-native-keyring-store = { version = "1", features = ["keychain"] }  # macOS Keychain backend for keyring-core
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }  # IMAP client, maintained, IDLE support
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["system-fonts", "floats"] }  # HTML mail: style and layout (Stylo, Taffy, Parley); beta, so pinned exactly. No "svg": usvg reads an <image href> path from disk
blitz-html = "=0.3.0-beta.3"                         # HTML mail: html5ever parsing into a Blitz document
blitz-paint = "=0.3.0-beta.3"                        # HTML mail: a laid-out document to draw commands
blitz-traits = "=0.3.0-beta.3"                       # HTML mail: the net provider and viewport types
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }         # INTERNALDATE comes back as chrono; also list output
clap = { version = "4", features = ["derive"] }      # CLI
clap-markdown = "0.1"                                # docs/src/cli.md generated from the clap definitions
data-url = "0.3"                                     # data: URIs in HTML mail; already in the tree through usvg
directories = "6"                                    # platform config/state/cache dirs
env_logger = "0.11"                                  # log output to stderr, RUST_LOG filter
fontique = "0.12"                                    # HTML mail: symbol fonts as a fallback for every script; the version Blitz's Parley uses
futures-util = { version = "0.3", default-features = false }  # collect async-imap streams
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }  # DNS TXT lookups for BIMI sender logos; std has no TXT query
html5ever = "=0.40.1"                                # HTML mail: parse as HTML ourselves, since Blitz's entry point parses XHTML-looking mail as XML; pinned to blitz-html's version
humantime = "2"                                      # "1h", "2d" in rules
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }  # headless GUI tests: key events, mock time, elements found by accessible label, snapshots from the software renderer
i-slint-common = "=1.18.1"                           # Slint's own fontique loads fontconfig at runtime on Linux; one linked and one loaded copy do not build together
include_dir = "0.7"                                  # embed postvak-core's migrations/ in the binary
keyring-core = "1"                                   # OS keyring API
log = "0.4"                                          # logging facade
mail-parser = "0.11"                                 # RFC 5322 header and body parsing
notify-rust = "4"                                    # desktop notifications from `run`
image = { version = "0.25", default-features = false }  # HTML mail: read an image's size from its header to refuse decompression bombs; the decoders Blitz enables; already in the tree through Blitz
percent-encoding = "2"                               # HTML mail: decode cid: URLs; already in the tree through url
png = "0.18"                                         # decodes the icons and reads and writes the GUI snapshots
proptest = { version = "1", default-features = false, features = ["std"] }  # postvak-core's tests/fuzz.rs (hostile input never panics the parsers) and tests/sync_model.rs (random sync event sequences, shrunk)
regex = "1"                                          # rule regex conditions and alias wildcards
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }  # MCP server for `postvak mcp`, hand-written handler on stdio
rpassword = "7"                                      # hidden password prompt in `account add`
rusqlite = { version = "0.40", features = ["bundled"] }       # SQLite, bundled build includes FTS5
rusqlite_migration = { version = "2", features = ["from-directory"] }  # numbered SQL migrations
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }  # TLS without a C toolchain
schemars = "1"                                       # JSON Schema for rules.toml, generated from the rule types
serde = { version = "1", features = ["derive"] }     # config, rules, rows
serde_json = "1"                                     # --json output
serde_rusqlite = "0.43"                              # rows to structs
signal-hook = { version = "0.4", default-features = false }  # stop the daemon cleanly on SIGTERM (docker stop, systemctl stop) and Ctrl-C; signal-hook-registry is already in the tree through zbus
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }  # the GUI window (royalty-free licence: About shows AboutSlint); default features: winit with runtime-loaded X11/Wayland, femtovg and software renderers, AccessKit, the system tray; unstable-winit-030 to raise the window from the tray (pinned, so the unstable API cannot shift)
slint-build = "=1.18.1"                              # compiles the window's ui/*.slint into Rust
socket2 = { version = "0.6", features = ["all"] }     # TCP keepalive on the IMAP socket so dead connections fail; "all" exposes the retry count
sys-locale = "0.3"                                   # the device locale, to group digits in counts the way the user expects
tempfile = "3"                                       # temp dirs for store and paths tests
thiserror = "2"                                      # user-facing error enums
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }  # current-thread runtimes for async-imap and the MCP server
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }  # TLS stream for tokio
toml = "1"                                           # config.toml and rules.toml
toml_edit = "0.25"                                   # approve/reject edit rules.toml in place, keeping comments
ureq = { version = "3", default-features = false, features = ["rustls"] }  # HTTP over the same rustls and ring: remote images in HTML mail when the user asks, the update check, and one-click unsubscribe
url = "2"                                            # parse URLs to check their host before Postvak contacts it; already in the tree through Blitz and webbrowser
webpki-roots = "1"                                   # root certificates
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }  # Secret Service backend for keyring-core
zeroize = "1"                                        # wipe secrets on drop

[workspace.lints.rust]
unsafe_code = "deny"                                 # no unsafe in Postvak; only Slint's generated `ui` module allows it

[workspace.lints.clippy]
unwrap_used = "deny"                                 # shipped code returns errors instead of panicking
expect_used = "deny"                                 # same; allow narrowly where a call cannot fail
panic = "deny"                                       # no deliberate panics outside tests
todo = "deny"                                        # unfinished code does not ship
unimplemented = "deny"                               # same as todo
unreachable = "deny"                                 # a "cannot happen" panic is still a panic; return an error or allow narrowly
dbg_macro = "warn"                                   # debug output stays out of commits

[package]
name = "postvak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Only what the build needs; keeps the test CA key, design docs and CI config out of the published crate.
include = ["/CHANGELOG.md", "/Cargo.lock", "/LICENSE-*", "/README.md", "/src/**"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
postvak-core.workspace = true
postvak-gui = { workspace = true, optional = true }
postvak-mcp = { workspace = true, optional = true }
rpassword.workspace = true
serde_json.workspace = true

[dev-dependencies]
clap-markdown.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true

[features]
default = ["gui", "mcp"]
gui = ["dep:postvak-gui"]                            # `postvak gui` with HTML mail; off builds the CLI alone
mcp = ["dep:postvak-mcp"]                            # `postvak mcp`; off builds without the MCP server
testing = ["postvak-core/testing"]                   # exposes RecordingOps and the one-shot sync steps to tests/imap_live.rs, and swaps the OS keyring for an in-memory one: never on in a real build

[[test]]
name = "imap_live"
required-features = ["testing"]                      # drives sync::run_once and sync_all against Dovecot

[profile.dev.package."*"]
opt-level = 2

# What CI tests with: optimised enough for the property tests, line tables only so builds and links stay small.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
# Crash reports' backtraces name file:line.
debug = "line-tables-only"

[profile.dist]
inherits = "release"
